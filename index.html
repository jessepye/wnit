<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>What Neighborhood Is This?</title>
    <meta name="description" content="Open the map, see a pin where you are and the name of the neighborhood you're in. Works anywhere OpenStreetMap knows the neighborhood names." />
    <meta name="theme-color" content="#e8590c" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="vendor/maplibre-gl-5.24.0/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Map. Tap anywhere or drag the pin to look up that spot."></div>

    <header class="topbar">
      <form id="search" class="search" role="search" autocomplete="off">
        <input id="q" type="search" name="q" placeholder="Search an address or place" aria-label="Search an address or place" enterkeyhint="search" />
        <button type="submit" class="icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
        </button>
      </form>
      <button id="locate" type="button" class="locate icon-btn" aria-label="Find my location" title="Find my location">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2.2" class="dot" /><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" /></svg>
      </button>
      <ul id="results" class="results" hidden></ul>
    </header>

    <section id="card" class="card" aria-live="polite" data-state="welcome">
      <p class="eyebrow" id="eyebrow">What neighborhood is this?</p>
      <h1 id="hood">Finding you…</h1>
      <p id="broader" class="broader" hidden></p>
      <p id="where" class="where" hidden></p>
      <p id="note" class="note" hidden></p>
      <div class="actions" id="actions" hidden>
        <button id="share" type="button" class="chip">Share this spot</button>
        <a id="fix" class="chip ghost" target="_blank" rel="noopener" title="Leave a note for OpenStreetMap mappers about this spot">Wrong? Tell OSM</a>
      </div>
      <p class="credits">
        © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors ·
        <a href="https://openfreemap.org/" target="_blank" rel="noopener">OpenFreeMap</a> ·
        <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> ·
        <a href="https://nominatim.org/" target="_blank" rel="noopener">Nominatim</a>
      </p>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
